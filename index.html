<!DOCTYPE html>
<html>
<head>
    <title>Login - Mi Pagina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 95%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; }
        a { display: block; text-align: center; margin-top: 10px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <input type="text" placeholder="Usuario o Correo">
        <input type="password" placeholder="Contraseña">
        <button>Iniciar Sesión</button>
        <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
</body>
</html>
